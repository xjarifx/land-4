services:
  postgres:
    image: postgres:16-alpine
    container_name: nid-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nid_auth
    ports:
      - "5432:5432"
    volumes:
      - nid_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nid_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nid_auth_postgres_data:
